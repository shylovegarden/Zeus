[package]
name = "zeus-pkg"
version = "0.1.0"
edition = "2021"
description = "Zeus Package Manager"
license = "MIT"
repository = "https://github.com/shylovegarden/Zeus"

[[bin]]
name = "zeus"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
toml = "0.8"
