name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Build and test
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
    
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y llvm-14 libz3-dev
    
    - name: Build
      run: cd zeus_compiler && cargo build --release
    
    - name: Test
      run: cd zeus_compiler && cargo test --release
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: zeus-${{ matrix.os }}
        path: |
          zeus_compiler/target/release/zeus*

  # Create release
  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          zeus-*/zeus*
        draft: true
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
