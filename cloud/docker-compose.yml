version: '3.8'

services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/zeus_cloud
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-secret-key-here
      - RUST_LOG=info
    depends_on:
      - db
      - redis
    volumes:
      - ./zeus_compiler:/usr/local/bin/zeus_compiler:ro
    networks:
      - zeus-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=zeus_cloud
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - zeus-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - zeus-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
    networks:
      - zeus-network

volumes:
  postgres_data:

networks:
  zeus-network:
    driver: bridge
